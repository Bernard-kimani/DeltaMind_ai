[project]
name = "deltamind-backend"
version = "0.1.0"
description = "DeltaMind AI — autonomous options trading agents for the Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "openai>=1.40",
    "anthropic>=0.34",
    "alpaca-py>=0.30",
    "mcp>=1.0",
    "sqlalchemy>=2.0",
    "websockets>=13.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
postgres = ["psycopg2-binary>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
